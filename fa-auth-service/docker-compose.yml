version: '3.8'

services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=development
      - APP_PORT=8001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=farmagent
      - DB_PASSWORD=farmagent_secret
      - DB_NAME=farmagent_auth
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - farmagent-network

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: farmagent
      POSTGRES_PASSWORD: farmagent_secret
      POSTGRES_DB: farmagent_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmagent -d farmagent_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - farmagent-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - farmagent-network

volumes:
  postgres_data:
  redis_data:

networks:
  farmagent-network:
    driver: bridge
